name: CallStencil CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run --frozen pytest
      - run: uv run --frozen mypy src
      - run: uv build
      - name: Clean wheel installation
        run: |
          uv venv .clean
          uv pip install --python .clean/bin/python dist/*.whl
          .clean/bin/callstencil --version
          .clean/bin/callstencil-scenarios --output .clean/evidence
